name: AppImage

# One Orbit for every distribution: built on an old base (Ubuntu 22.04, glibc 2.35) with
# Qt, libtorrent and curl bundled, then run on several distributions to prove it.
# (The Linux archive is built against the distribution's own Qt and libtorrent, so it only
# runs on systems as new as the one that built it.)

on:
  push:
    branches: [main, linux-ux]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.8.3
  AQTINSTALL_VERSION: 3.3.0
  LIBTORRENT_TAG: v2.1.2
  CURL_VERSION: 8.11.1
  CURL_SHA256: c7ca7db48b0909743eaef34250da02c19bc61d4f1dcedd6603f109409536ab56
  BOOST_URL: https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.bz2
  BOOST_SHA256: af57be25cb4c4f4b413ed692fe378affb4352ea50fbe294a11ef548f4d527d89
  LINUXDEPLOY_TAG: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  PLUGIN_QT_TAG: 1-alpha-20250213-1
  PLUGIN_QT_SHA256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724

jobs:
  build:
    name: Build (Ubuntu 22.04 base)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      DEPS: /opt/orbit-deps
      CC: gcc-12
      CXX: g++-12
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential gcc-12 g++-12 cmake ninja-build pkg-config git curl ca-certificates file patchelf \
            xz-utils bzip2 python3-pip libssl-dev zlib1g-dev libnghttp2-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dev libegl1 libopengl0 libfontconfig1 \
            libfreetype6 libdbus-1-3 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1

      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          pip3 install "aqtinstall==$AQTINSTALL_VERSION"
          python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O /opt/qt
          echo "QT_ROOT=/opt/qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Build curl ${{ env.CURL_VERSION }}
        run: |
          # Ubuntu 22.04's curl (7.81) lacks options Orbit uses.
          curl -sSfLO "https://curl.se/download/curl-$CURL_VERSION.tar.xz"
          echo "$CURL_SHA256  curl-$CURL_VERSION.tar.xz" | sha256sum -c
          tar xf "curl-$CURL_VERSION.tar.xz"
          cd "curl-$CURL_VERSION"
          ./configure --prefix="$DEPS" --with-openssl --with-nghttp2 --without-libpsl --without-libidn2 \
            --without-brotli --without-zstd --disable-ldap --disable-ldaps --disable-manual --disable-static
          make -j"$(nproc)" install

      - name: Build libtorrent ${{ env.LIBTORRENT_TAG }}
        run: |
          curl -sSfL -o boost.tar.bz2 "$BOOST_URL"
          echo "$BOOST_SHA256  boost.tar.bz2" | sha256sum -c
          mkdir -p "$DEPS/include" && tar xjf boost.tar.bz2
          cp -r boost_1_87_0/boost "$DEPS/include/"
          git clone --depth 1 --branch "$LIBTORRENT_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/arvidn/libtorrent.git
          cmake -S libtorrent -B lt-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -Dpython-bindings=OFF -DCMAKE_INSTALL_PREFIX="$DEPS" -DCMAKE_PREFIX_PATH="$DEPS" \
            -DBoost_INCLUDE_DIR="$DEPS/include"
          cmake --build lt-build
          cmake --install lt-build

      - name: Fetch linuxdeploy (pinned)
        run: |
          mkdir -p installer/appimage/tools && cd installer/appimage/tools
          curl -sSfLO "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_TAG/linuxdeploy-x86_64.AppImage"
          curl -sSfLO "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/$PLUGIN_QT_TAG/linuxdeploy-plugin-qt-x86_64.AppImage"
          printf '%s  %s\n%s  %s\n' "$LINUXDEPLOY_SHA256" linuxdeploy-x86_64.AppImage \
            "$PLUGIN_QT_SHA256" linuxdeploy-plugin-qt-x86_64.AppImage | sha256sum -c
          chmod +x ./*.AppImage

      - name: Build the AppImage
        run: |
          export QMAKE="$QT_ROOT/bin/qmake" CMAKE_PREFIX_PATH="$QT_ROOT:$DEPS"  # an environment list, so ":" on Linux
          export LD_LIBRARY_PATH="$DEPS/lib:$QT_ROOT/lib"
          installer/appimage/build-appimage.sh

      - name: Start it here
        run: |
          app=$(ls installer/Output/Orbit-*-x86_64.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "$app" --version

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-appimage
          path: installer/Output/Orbit-*-x86_64.AppImage
          retention-days: 30

  smoke:
    name: Runs on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04", "fedora:latest", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbit-appimage

      # What any desktop has but a bare container doesn't: the GL/EGL drivers, fontconfig,
      # D-Bus and X client libraries (an AppImage leaves those to the system), and certificates.
      - name: Install the system's basics
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates libgl1 libegl1 libopengl0 libfontconfig1 libdbus-1-3 libxkbcommon0 libx11-6 libxcb1 \
              libglib2.0-0 libfreetype6 curl
          elif command -v dnf >/dev/null; then
            dnf install -y ca-certificates mesa-libGL mesa-libEGL libglvnd-opengl fontconfig dbus-libs libxkbcommon \
              libX11 glib2 freetype curl
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm ca-certificates libglvnd mesa fontconfig dbus libxkbcommon libx11 glib2 freetype2 curl
          fi

      - name: Start headless, check status, download a file
        shell: bash
        run: |
          app=$(ls Orbit-*-x86_64.AppImage) && chmod +x "$app"
          export APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen
          export HOME=$PWD/home XDG_RUNTIME_DIR=$PWD/rt XDG_CONFIG_HOME=$PWD/home/.config XDG_DATA_HOME=$PWD/home/.local/share
          mkdir -p "$HOME/Downloads" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          ./"$app" --version
          ./"$app" --headless > orbit.out 2>&1 &
          for i in $(seq 60); do ./"$app" status >/dev/null 2>&1 && break; sleep 1; done
          ./"$app" status
          url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/LICENSE
          ./"$app" add -d "$HOME/Downloads" "$url"
          curl -sSfL -o reference "$url"
          for i in $(seq 60); do cmp -s reference "$HOME/Downloads/LICENSE" && break; sleep 1; done
          ./"$app" list
          if ! cmp reference "$HOME/Downloads/LICENSE"; then tail -30 orbit.out; exit 1; fi
          echo "Downloaded over https and byte-identical."
          kill %1; wait || true
